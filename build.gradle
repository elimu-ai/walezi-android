plugins {
    id 'com.android.application' version '8.1.4'
}

android {
    namespace 'org.pandcorps.pandam.android'
    compileSdk 33

    defaultConfig {
        minSdk 14
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = [
                'src',
                'pandam/core/src/main/java',
                'pandam/game-base/src/main/java',
                'pandam/game-furguardians/src/main/java',
                'pandam/game-botsnbolts/src/main/java',
                'pandam/game-board/src/main/java'
            ]
            java.filter.exclude 'org/pandcorps/core/Audtil.java'
            resources.srcDirs = [
                'pandam/core/src/main/resources',
                'pandam/game-base/src/main/resources',
                'pandam/game-furguardians/src/main/resources',
                'pandam/game-botsnbolts/src/main/resources',
                'pandam/game-board/src/main/resources'
            ]
            res.srcDirs = ['res']
        }
        furguardians {
            manifest.srcFile 'game/furguardians/AndroidManifest.xml'
            res.srcDirs = ['game/furguardians/res']
        }
        botsnbolts {
            manifest.srcFile 'game/botsnbolts/AndroidManifest.xml'
            res.srcDirs = ['game/botsnbolts/res']
        }
        board {
            manifest.srcFile 'game/board/AndroidManifest.xml'
            res.srcDirs = ['game/board/res']
        }
    }

    flavorDimensions = ['game']

    productFlavors {
        furguardians {
            dimension 'game'
            applicationId 'org.pandcorps.furguardians'
            versionCode 47
            versionName '1.27.6'
        }
        botsnbolts {
            dimension 'game'
            applicationId 'org.pandcorps.botsnbolts'
            versionCode 9
            versionName '1.0.8'
        }
        board {
            dimension 'game'
            applicationId 'org.pandcorps.board'
            versionCode 1
            versionName '1.0.0'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
}
